databases:
  - name: store-intelligence-db
    databaseName: storedb
    user: user
    plan: free

services:
  - type: redis
    name: store-intelligence-redis
    plan: free
    ipAllowList: [] # Allow only internal service access

  - type: web
    name: store-intelligence-api
    env: docker
    dockerfilePath: app/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: store-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: store-intelligence-redis
          type: redis
          property: connectionString
      - key: VALID_API_KEYS
        value: test_key_1,test_key_2
      - key: CORS_ORIGINS
        value: '*'

  - type: web
    name: store-intelligence-dashboard
    env: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://store-intelligence-api-sydb.onrender.com

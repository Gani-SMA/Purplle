version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: store_intelligence_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: storedb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d storedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: store_intelligence_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: store_intelligence_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/storedb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dashboard service (React + Vite + Tailwind + Nginx)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: store_intelligence_dashboard
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

  # CV Pipeline Runner (YOLOv8 + ByteTrack)
  pipeline-runner:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: store_intelligence_pipeline
    restart: on-failure
    environment:
      - REDIS_URL=redis://redis:6379/0
      - API_URL=http://api:8000
      - API_KEY=test_key_1
      - YOLO_MODEL_PATH=/app/models/yolov8x.pt
    volumes:
      - ./pipeline:/app
      - ${CCTV_FOOTAGE_PATH:-C:\Users\kkbha\Downloads\CCTV Footage-20260529T160731Z-3-00144614ea\CCTV Footage}:/data/cctv:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started


volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
